version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: commit-viewer-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: commit-viewer-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always
